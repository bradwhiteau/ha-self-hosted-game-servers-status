[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.self_hosted_game_servers"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "C4", "PT", "RET"]
ignore = ["E501", "PLR2004", "PLR0913"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components", "tests"]
